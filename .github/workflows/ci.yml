name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests on the Trainium2 CPU simulator
        run: pytest -q
      - name: Quick benchmark
        run: python bench/run_bench.py --quick --out /tmp/results.json
